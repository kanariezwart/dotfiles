---
name: Test dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stow:
    name: Test stow packages
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stow
        run: brew install stow

      - name: Test stow packages
        run: make test

  brewfile:
    name: Validate Brewfile
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Brewfile syntax
        run: |
          brew bundle list --file=install/Brewfile
          echo "Brewfile syntax OK"

  shellcheck:
    name: Lint shell files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint zsh files
        run: |
          shellcheck --shell=bash -x --exclude=SC1091 \
            zsh/.zsh/aliases.zsh \
            zsh/.zsh/aliases-osx.zsh \
            zsh/.zsh/functions.zsh \
            install.sh \
            test/run.sh

  yamllint:
    name: Lint YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: yamllint .github/workflows/

  zsh-syntax:
    name: Check zsh syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get install -y zsh

      # shellcheck only understands bash; zsh -n parses actual zsh syntax
      - name: zsh -n
        run: |
          for f in zsh/.zshrc zsh/.zprofile zsh/.zsh/*.zsh \
                   shell/.shell_env install.sh install/macos.sh; do
            echo "Checking $f"
            zsh -n "$f"
          done

  zsh-startup:
    name: Smoke test zsh startup
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stow
        run: brew install stow

      - name: Start an interactive shell with the dotfiles
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          make stow
          # first run clones zcomet and plugins
          zsh -ic exit </dev/null >/dev/null 2>&1 || true
          # second run must print nothing but READY (no errors or warnings)
          out=$(script -q /dev/null zsh -ic 'echo READY' </dev/null 2>&1 \
            | tr -d '\r\004\010' | sed 's/\^D//g')
          echo "$out"
          [[ "$out" == "READY" ]]

      # runners are Apple Silicon: a login shell with a bare environment must
      # find Homebrew in /opt/homebrew via .zprofile (brew shellenv)
      - name: Homebrew on PATH in a login shell
        run: |
          bare_path=/usr/bin:/bin:/usr/sbin:/sbin
          out=$(env -i HOME="$RUNNER_TEMP/home" PATH="$bare_path" \
            zsh -lc 'echo "$(command -v brew) $HOMEBREW_PREFIX"')
          echo "$out"
          [[ "$out" == "/opt/homebrew/bin/brew /opt/homebrew" ]]

  secrets:
    name: Check for secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          repo="https://github.com/gitleaks/gitleaks"
          base="$repo/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/$sums"
          sha256sum -c --ignore-missing "$sums"
          tar xzf "$tarball" gitleaks

      - name: Scan full git history
        run: ./gitleaks git . --redact -v

  linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # stow + zsh startup in a vanilla ubuntu:24.04 container (see test/)
      - name: Smoke test zsh in a vanilla container
        run: make docker-test
